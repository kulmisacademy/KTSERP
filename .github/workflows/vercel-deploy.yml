# Flutter web → Vercel (NOT Next.js). Builds on GitHub, deploys static build/web.
name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_PROJECT_NAME: kulmiserp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub secrets
        run: |
          missing=0
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then echo "::error::Missing GitHub secret SUPABASE_URL"; missing=1; fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then echo "::error::Missing GitHub secret SUPABASE_ANON_KEY"; missing=1; fi
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then echo "::error::Missing GitHub secret VERCEL_TOKEN"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "Required secrets present."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create production .env
        working-directory: inventrax_erp
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          APP_NAME=InventraX ERP
          APP_ENV=production
          API_TIMEOUT=30000
          ENABLE_LOGS=false
          SENTRY_DSN=${SENTRY_DSN:-}
          AI_USE_EDGE_PROXY=true
          OPENAI_MODEL=gpt-4o-mini
          EOF

      - name: Build Flutter web
        working-directory: inventrax_erp
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --dart-define-from-file=.env
          test -f build/web/index.html
          echo "Build size: $(du -sh build/web | cut -f1)"
          ls -la build/web | head -15

      - name: Prepare Vercel prebuilt output
        working-directory: inventrax_erp
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          cp vercel.web.json .vercel/output/static/vercel.json
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/((?!.*\\.).*)", "dest": "/index.html" }
            ]
          }
          EOF
          test -f .vercel/output/static/index.html
          echo "Prebuilt bundle: $(du -sh .vercel/output/static | cut -f1)"
          ls -la .vercel/output/static | head -15

      - name: Install Vercel CLI
        run: npm install -g vercel@54.12.2

      - name: Deploy to Vercel production
        working-directory: inventrax_erp
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          SCOPE="${VERCEL_SCOPE:-kulmisacademys-projects}"
          DEPLOY_ARGS=(
            deploy
            --prebuilt
            --prod
            --yes
            --token "$VERCEL_TOKEN"
            --project "$VERCEL_PROJECT_NAME"
            --scope "$SCOPE"
          )
          echo "Running: vercel ${DEPLOY_ARGS[*]}"
          DEPLOY_LOG="$(mktemp)"
          if ! vercel "${DEPLOY_ARGS[@]}" 2>&1 | tee "$DEPLOY_LOG"; then
            echo "::error::vercel deploy command failed"
            exit 1
          fi
          if grep -qi "Project not found" "$DEPLOY_LOG"; then
            echo "::error::Vercel project '$VERCEL_PROJECT_NAME' not found in scope '$SCOPE'. Check VERCEL_TOKEN access."
            exit 1
          fi
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' "$DEPLOY_LOG" | tail -n 1)"
          echo "deployment_url=$DEPLOY_URL"
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: https://kulmiserp.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $VERCEL_PROJECT_NAME (scope: $SCOPE, prebuilt static)" >> "$GITHUB_STEP_SUMMARY"
          if [[ ! "$DEPLOY_URL" == http* ]]; then
            echo "::error::Vercel deploy did not return a URL"
            exit 1
          fi
